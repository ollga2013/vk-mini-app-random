name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint and tests (if any)
        run: |
          npm run lint || echo "No lint script"
          npm test || echo "No test script"

      - name: Build static assets (if build script exists)
        run: |
          if npm run | grep -q "build"; then npm run build; fi

      - name: Upload artifact for static site
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: ./dist  # adjust if your build outputs to another folder

  deploy_pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download static site artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site

      - name: Deploy to GitHub Pages
        uses: actions/configure-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./

  docker_build_and_push:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/vk-winner-mini-app:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/vk-winner-mini-app:latest

      - name: Deploy backend (example for Fly.io)
        if: false # enable when you have flyctl set up
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -L https://fly.io/install.sh | sh
          export PATH=$HOME/.flyctl/bin:$PATH
          flyctl deploy --image ${{ secrets.DOCKER_USERNAME }}/vk-winner-mini-app:latest
